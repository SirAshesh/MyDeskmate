[workspace]
resolver = "2"
members = [
    "crates/emu-core",
    "crates/esp-periph",
    "crates/esp-soc",
    "crates/xtensa-lx7",
    "crates/esp32s3",
    "app",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
